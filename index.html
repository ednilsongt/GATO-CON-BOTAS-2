<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDNILSON GT - Streaming</title>
    <meta name="description" content="Canal oficial de EDNILSON GT - Transmisiones en vivo y videos">
    
    <!-- Icono y estilo moderno -->
    <link rel="icon" href="https://i.imgur.com/1Qz3f5G.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #ff0000, #ff6b00);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        header h1 {
            font-size: 2rem;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }
        .container {
            flex: 1;
            position: relative;
            background: #000;
        }
        iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #ff0000;
        }
        footer {
            background: #111;
            padding: 10px;
            text-align: center;

        }
        @media (max-width: 768px) {

</head>
<body>

            allowfullscreen
            allow="autoplay; fullscreen; encrypted-media"
            sandbox="allow-scripts allow-same-origin allow-popups allow-modals"
            loading="lazy">
        </iframe>
    </div>

    <footer>
        © 2025 EDNILSON GT - Todos los derechos reservados

    <script>
